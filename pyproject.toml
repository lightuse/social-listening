[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-listening"
version = "0.1.0"
description = "Social media listening and sentiment analysis service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "boto3==1.35.90",
    "sqlalchemy==2.0.36",
    "httpx==0.28.1",
    "tweepy==4.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-config",
    "--verbose",
    "--color=yes",
    "--tb=short",
]
testpaths = [
    "tests",
    ".",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests", 
    "aws: marks tests that require AWS credentials",
    "bedrock: marks tests that require AWS Bedrock access",
    "requires_aws: marks tests that require actual AWS access (not mock)",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:tweepy.*",
    "ignore::DeprecationWarning:botocore.*",
    "ignore:.*imghdr.*:DeprecationWarning",
    "ignore:.*utcnow.*:DeprecationWarning:sqlalchemy.*",
    "error::pytest.PytestUnknownMarkWarning",
]

[tool.uv]
dev-dependencies = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.uv.sources]
# カスタムインデックスURLがある場合はここに記載

[project.scripts]
# Entry points for the application
social-listening = "main:app"

# Note: UV scripts are not supported in pyproject.toml
# Use shell scripts or Makefile instead
