name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv sync --all-extras
    
    - name: Verify pytest installation
      run: |
        uv run python -c "import pytest; print(f'pytest version: {pytest.__version__}')"
    
    - name: Run unit tests
      run: |
        echo "🧪 Running core unit tests..."
        uv run pytest tests/ -k "not (aws or bedrock)" --maxfail=5
      continue-on-error: false
    
    - name: Run integration tests (without AWS)
      run: |
        echo "🔗 Running integration tests (excluding AWS)..."
        uv run pytest tests/ -k "not (aws or bedrock)" --cov-append
      continue-on-error: false
    
    # AWS関連テストは環境変数が設定されている場合のみ実行
    - name: Run AWS integration tests
      if: env.AWS_ACCESS_KEY_ID != ''
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      run: |
        echo "🔧 Running AWS Bedrock integration tests..."
        uv run pytest tests/ -k "aws or bedrock" --verbose --tb=short || echo "⚠️ AWS tests failed - this is expected if credentials are not configured"
      continue-on-error: true  # AWS テストは失敗してもCIを止めない
    
    # AWS関連テストが設定されていない場合の代替テスト（モックモード）
    - name: Run AWS tests in mock mode
      if: env.AWS_ACCESS_KEY_ID == ''
      run: |
        echo "🎭 Running AWS tests in mock mode (no credentials configured)..."
        uv run pytest tests/ -k "aws or bedrock" --verbose --tb=short -m "not requires_aws" || echo "ℹ️ Mock mode tests completed"
      continue-on-error: true
    
    - name: Test Results Summary
      if: always()
      run: |
        echo "📊 Test Execution Summary"
        echo "========================="
        echo "✅ Core tests: Should always pass"
        echo "⚠️  AWS tests: May fail if credentials not configured (this is expected)"
        echo "🎭 Mock tests: Alternative when AWS access unavailable"
        echo ""
        echo "This CI pipeline is designed to be resilient:"
        echo "- Core functionality is always tested"
        echo "- AWS tests are optional and won't block deployment"
        echo "- Mock implementations ensure development can continue"
    
    - name: Code quality checks
      run: |
        uv run black --check . || echo "Black check failed but continuing..."
        uv run isort --check-only . || echo "isort check failed but continuing..."
        uv run flake8 . || echo "flake8 check failed but continuing..."
      continue-on-error: true
    
    - name: Check coverage file
      run: |
        if [ -f "coverage.xml" ]; then
          echo "✅ Coverage file found"
          head -n 5 coverage.xml
        else
          echo "❌ Coverage file not found"
          ls -la
        fi
    
    - name: Upload coverage reports
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: false
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Security audit
      run: |
        uv sync --extra security
        uv run pip-audit
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t social-listening:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm social-listening:latest python -c "import sys; print(f'Python {sys.version}')"
