name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv sync --all-extras
    
    - name: Verify pytest installation
      run: |
        uv run python -c "import pytest; print(f'pytest version: {pytest.__version__}')"
    
    - name: Run unit tests
      run: |
        uv run pytest tests/ -v --tb=short
      continue-on-error: false
    
    - name: Run integration tests (without AWS)
      run: |
        uv run pytest tests/ -k "not (aws or bedrock)" --verbose
      continue-on-error: false
    
    # AWS関連テストは環境変数が設定されている場合のみ実行
    - name: Run AWS integration tests
      if: env.AWS_ACCESS_KEY_ID != ''
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      run: |
        uv run pytest tests/ -k "aws or bedrock" --verbose
      continue-on-error: true  # AWS テストは失敗してもCIを止めない
    
    - name: Code quality checks
      run: |
        uv run black --check . || echo "Black check failed but continuing..."
        uv run isort --check-only . || echo "isort check failed but continuing..."
        uv run flake8 . || echo "flake8 check failed but continuing..."
      continue-on-error: true
    
    - name: Upload coverage reports
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Security audit
      run: |
        uv sync
        uv run pip-audit
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t social-listening:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm social-listening:latest python -c "import sys; print(f'Python {sys.version}')"
